<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f6ff"/>
      <stop offset="1" stop-color="#cdeeff"/>
    </linearGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#0277bd"/>
    </linearGradient>
    <linearGradient id="borda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7ecf7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- tapete -->
  <rect x="90" y="190" width="620" height="440" rx="70" fill="url(#borda)" stroke="#9fd3ee" stroke-width="6"/>
  <rect x="135" y="235" width="530" height="350" rx="45" fill="url(#agua)"/>
  <!-- ondas -->
  <path d="M135 330 q35 -22 70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t40 0" fill="none" stroke="#b3e5fc" stroke-width="5" opacity=".6"/>
  <path d="M135 470 q35 -22 70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t70 0 t40 0" fill="none" stroke="#b3e5fc" stroke-width="5" opacity=".5"/>
  <!-- peixe laranja -->
  <g transform="translate(250 330)">
    <ellipse cx="0" cy="0" rx="58" ry="36" fill="#ff9800"/>
    <path d="M50 0 l45 -32 v64z" fill="#ff9800"/>
    <path d="M-18 -34 v68" stroke="#fff" stroke-width="10"/>
    <circle cx="-30" cy="-8" r="8" fill="#fff"/><circle cx="-32" cy="-8" r="4" fill="#263238"/>
  </g>
  <!-- peixe amarelo -->
  <g transform="translate(520 300) scale(-0.8 0.8)">
    <ellipse cx="0" cy="0" rx="58" ry="36" fill="#ffd54f"/>
    <path d="M50 0 l45 -32 v64z" fill="#ffd54f"/>
    <circle cx="-30" cy="-8" r="8" fill="#fff"/><circle cx="-32" cy="-8" r="4" fill="#263238"/>
  </g>
  <!-- peixe rosa -->
  <g transform="translate(470 480) scale(0.9)">
    <ellipse cx="0" cy="0" rx="58" ry="36" fill="#f06292"/>
    <path d="M50 0 l45 -32 v64z" fill="#f06292"/>
    <circle cx="-30" cy="-8" r="8" fill="#fff"/><circle cx="-32" cy="-8" r="4" fill="#263238"/>
  </g>
  <!-- estrela-do-mar -->
  <path transform="translate(255 505) scale(1.1)" d="M0 -40 L11 -12 L40 -12 L17 6 L25 35 L0 18 L-25 35 L-17 6 L-40 -12 L-11 -12 Z" fill="#ff7043" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
  <!-- bolhas -->
  <g fill="#e1f5fe" opacity=".85">
    <circle cx="360" cy="270" r="10"/><circle cx="380" cy="300" r="6"/>
    <circle cx="610" cy="410" r="12"/><circle cx="630" cy="380" r="7"/>
    <circle cx="180" cy="420" r="8"/><circle cx="340" cy="560" r="9"/>
  </g>
  <!-- válvula -->
  <rect x="680" y="390" width="22" height="40" rx="8" fill="#9fd3ee"/>
  <text x="400" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#0277bd">Baby Ocean</text>
  <text x="400" y="745" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#4f7d99">Tapete de Água Inflável</text>
</svg>
